name: GuavaStudioRuntime CI

on:
  push:
    branches: [main]
    paths:
      - 'Engine/**'
      - 'GuavaUI/Portable/**'
      - 'Platforms/Web/Plugins/**'
      - '.github/workflows/ci-engine.yml'
      - '.github/actions/setup-toolchains/**'
      - 'Tools/Developer/**'
      - 'cmake/**'
  pull_request:
    paths:
      - 'Engine/**'
      - 'GuavaUI/Portable/**'
      - 'Platforms/Web/Plugins/**'
      - '.github/workflows/ci-engine.yml'
      - '.github/actions/setup-toolchains/**'
      - 'Tools/Developer/**'
      - 'cmake/**'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: xcode-27
          - name: Linux
            runs-on: ubuntu-latest
          - name: Windows
            runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up build toolchains
        uses: ./.github/actions/setup-toolchains

      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'Linux'
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Swift version
        shell: bash
        run: swift --version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libibus-1.0-dev \
            libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev libsndio-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            mesa-common-dev ninja-build

      - name: Build native deps via CMake (SDL3 + Imath + OpenEXR + Jolt)
        shell: bash
        run: |
          # Mirror guava-dev native-bootstrap exactly: a blanket build (ALL) first builds every
          # bundled lib (all webp variants, plutovg, lunasvg, jolt, ocio/openexr,
          # SDL3 via stage_sdl3 ALL) so the install step finds them; stage_sdl3 /
          # stage_image_decode then stage the bundles; --prefix keeps stray
          # install() rules out of the unwritable system /usr/local.
          cmake -S Engine/third-party -B Engine/build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build Engine/build/native --parallel --config Release
          cmake --build Engine/build/native --parallel --config Release --target stage_sdl3
          cmake --build Engine/build/native --parallel --config Release --target stage_image_decode
          cmake --install Engine/build/native --config Release --prefix "$RUNNER_TEMP/guava-native-install"

      - name: Build pinned FFmpeg
        shell: bash
        run: swift run --package-path Tools/Developer guava-dev media

      # The Engine package depends on the local Media package, whose FFmpeg
      # binaryTarget needs the bundle that `guava-dev media` just staged into
      # Engine/Media/vendor. Resolving before that build reports
      # "does not contain a binary artifact", so resolve only after staging.
      - name: Resolve packages
        shell: bash
        working-directory: Engine
        run: swift package resolve

      - name: Build pure-Swift targets
        shell: bash
        working-directory: Engine
        run: |
          swift build --target EngineKernel
          swift build --target EngineMath
          swift build --target ObservationBus
          swift build --target SceneRuntime
          swift build --target AssetPipeline
          swift build --target SequenceRuntime
          swift build --target CardBattleRuntime
          swift build --target AIRuntime
          swift build --product GuavaPluginHost
          swift build --target PluginWasmtimeRuntime
          swift build --target PluginRuntime
          swift build --target IntentRuntime
          swift build --target ScriptRuntime
          # AudioRuntime pulls CSDL3; on Linux/Windows this compiles the SDL3
          # audio backend and FFmpeg decoder on every platform.
          swift build --target AudioRuntime

      - name: Run tests
        shell: bash
        working-directory: Engine
        # Run the package as a whole so every current and future test target is
        # exercised. Real GPU and host Vision smoke cases remain opt-in via
        # GUAVA_RUN_GPU_SMOKE_TESTS / GUAVA_RUN_VISION_SMOKE_TESTS and are
        # skipped on ordinary CI runners. Dedicated Metal regressions run in
        # ci-gpu.yml once GUAVA_GPU_CI_ENABLED and its runner are configured.
        run: swift test

      - name: Verify browser plugin execution
        if: runner.os == 'macOS'
        uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
      - name: Run Web Component Worker gates
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm ci --prefix Platforms/Web/Plugins --ignore-scripts
          npm test --prefix Platforms/Web/Plugins
          cmake -S Engine/Validation/Plugins -B Engine/build/plugin-probe -DGUAVA_WASMTIME_VARIANT="$PWD/Engine/vendor/Wasmtime.artifactbundle/macos-arm64"
          cmake --build Engine/build/plugin-probe --parallel 4
          host_bin=$(swift build --package-path Engine --show-bin-path)
          swift run --package-path Tools/Developer guava-dev browser web-plugins --host "$host_bin/GuavaPluginHost" --probe Engine/build/plugin-probe/GuavaPluginProbe

      - name: Run M7 destruction performance gates
        if: runner.os == 'macOS'
        shell: bash
        working-directory: Engine
        run: |
          GUAVA_PHYSICS_SCENARIO=destruction-fragments \
          GUAVA_PHYSICS_BODIES=4096 \
          GUAVA_PHYSICS_WARMUP_FRAMES=30 \
          GUAVA_PHYSICS_SAMPLE_FRAMES=120 \
          swift run -c release PhysicsRuntimeBenchmarks
          GUAVA_PHYSICS_SCENARIO=destruction-islands \
          GUAVA_PHYSICS_BODIES=4096 \
          GUAVA_PHYSICS_WARMUP_FRAMES=30 \
          GUAVA_PHYSICS_SAMPLE_FRAMES=120 \
          swift run -c release PhysicsRuntimeBenchmarks
