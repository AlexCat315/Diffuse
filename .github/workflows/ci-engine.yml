name: GuavaStudioRuntime CI

on:
  push:
    branches: [main]
    paths:
      - 'Engine/**'
      - 'Platforms/Web/Plugins/**'
      - '.github/workflows/ci-engine.yml'
      - '.github/actions/setup-toolchains/**'
      - '.github/actions/native-dependencies/**'
      - '.github/actions/fetch-sdk/**'
      - '.github/actions/build-cache/**'
      - 'Editor/guava.json'
      - 'guava'
      - 'guava.cmd'
      - 'Tools/Developer/Package.swift'
      - 'Tools/Developer/Sources/Build/**'
      - 'cmake/**'
  pull_request:
    paths:
      - 'Engine/**'
      - 'Platforms/Web/Plugins/**'
      - '.github/workflows/ci-engine.yml'
      - '.github/actions/setup-toolchains/**'
      - '.github/actions/native-dependencies/**'
      - '.github/actions/fetch-sdk/**'
      - '.github/actions/build-cache/**'
      - 'Editor/guava.json'
      - 'guava'
      - 'guava.cmd'
      - 'Tools/Developer/Package.swift'
      - 'Tools/Developer/Sources/Build/**'
      - 'cmake/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      GUAVA_NATIVE_LINK_ORDER: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: xcode-27
            build-system: swiftbuild
          - name: Linux
            runs-on: ubuntu-latest
            build-system: native
          - name: Windows
            runs-on: windows-2025-vs2026
            build-system: native
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Guava SDK
        uses: ./.github/actions/fetch-sdk

      - uses: ./.github/actions/build-cache
        id: build-cache

      - name: Set up build toolchains
        uses: ./.github/actions/setup-toolchains

      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'Linux'
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Swift version
        shell: bash
        run: swift --version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libibus-1.0-dev \
            libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev libsndio-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            mesa-common-dev ninja-build vulkan-validationlayers

      - name: Test shared system contracts
        timeout-minutes: 5
        shell: bash
        run: ./guava test GuavaUI/System --no-parallel --timeout 120

      - name: Prepare cached native dependencies
        uses: ./.github/actions/native-dependencies


      - name: Build runtime products and tests
        timeout-minutes: 25
        shell: bash
        run: ./guava test Engine --build-only

      - uses: actions/cache/save@v5
        if: steps.build-cache.outputs.hit != 'true'
        with:
          key: ${{ steps.build-cache.outputs.key }}
          path: |
            Tools/Developer/.build
            GuavaUI/Tools/Guava/.build
            GuavaUI/System/.build
            Editor/.build
            Engine/.build

      - name: Run XCTest
        if: runner.os != 'Windows'
        shell: bash
        run: ./guava test Engine --skip-build --no-parallel --testing-library xctest --timeout 300

      - name: Run XCTest with hang diagnostics
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: ./GuavaUI/Tools/Testing/Windows.ps1 -Package Engine -Library xctest -Timeout 300 -SkipBuild -Output test-results/xctest

      - name: Run Swift Testing
        if: runner.os != 'Windows'
        shell: bash
        run: ./guava test Engine --skip-build --no-parallel --testing-library swift-testing --timeout 600 --event-output test-results/events.jsonl

      - name: Run Swift Testing with hang diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./GuavaUI/Tools/Testing/Windows.ps1 -Package Engine -SkipBuild -Output test-results

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-test-diagnostics-${{ matrix.name }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify browser plugin execution
        if: runner.os == 'macOS'
        uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
      - name: Run Web Component Worker gates
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm ci --prefix Platforms/Web/Plugins --ignore-scripts
          npm test --prefix Platforms/Web/Plugins
          cmake -S Engine/Validation/Plugins -B Engine/build/plugin-probe -DGUAVA_WASMTIME_VARIANT="$PWD/Engine/vendor/Wasmtime.artifactbundle/macos-arm64"
          cmake --build Engine/build/plugin-probe --parallel 4
          host_bin=$(swift build --package-path Engine --show-bin-path)
          ./guava studio browser web-plugins --host "$host_bin/GuavaPluginHost" --probe Engine/build/plugin-probe/GuavaPluginProbe

      - name: Run M7 destruction performance gates
        if: runner.os == 'macOS'
        shell: bash
        working-directory: Engine
        run: |
          GUAVA_PHYSICS_SCENARIO=destruction-fragments \
          GUAVA_PHYSICS_BODIES=4096 \
          GUAVA_PHYSICS_WARMUP_FRAMES=30 \
          GUAVA_PHYSICS_SAMPLE_FRAMES=120 \
          swift run -c release PhysicsRuntimeBenchmarks
          GUAVA_PHYSICS_SCENARIO=destruction-islands \
          GUAVA_PHYSICS_BODIES=4096 \
          GUAVA_PHYSICS_WARMUP_FRAMES=30 \
          GUAVA_PHYSICS_SAMPLE_FRAMES=120 \
          swift run -c release PhysicsRuntimeBenchmarks
