name: TypeScript plugins
on:
  push:
    branches: [main]
    paths: ['Engine/Sources/Plugin*/**', 'Engine/Tests/PluginRuntimeTests/**', 'PluginSDK/**', 'Editor/Plugins/**', 'bun.lock', 'package.json', 'Tools/Developer/Package.swift', 'Tools/Developer/Sources/Build/**', 'Editor/cove.json', 'cove', 'cove.cmd', '.github/actions/fetch-sdk/**', '.github/workflows/ci-plugins.yml']
  pull_request:
    paths: ['Engine/Sources/Plugin*/**', 'Engine/Tests/PluginRuntimeTests/**', 'PluginSDK/**', 'Editor/Plugins/**', 'bun.lock', 'package.json', 'Tools/Developer/Package.swift', 'Tools/Developer/Sources/Build/**', 'Editor/cove.json', 'cove', 'cove.cmd', '.github/actions/fetch-sdk/**', '.github/workflows/ci-plugins.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, ubuntu-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Cove SDK
        uses: ./.github/actions/fetch-sdk
      - uses: SwiftyLab/setup-swift@v1.14.1
        if: runner.os != 'macOS'
        with: {swift-version: '6.4.1'}
      - name: Prepare the pinned Bun runtime and TypeScript plugins
        shell: bash
        run: ./cove studio plugins prepare
      - name: Verify public SDK and conversation concurrency
        shell: bash
        run: ./cove studio plugins verify
