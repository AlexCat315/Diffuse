name: Plugin runtimes
on:
  push:
    branches: [main]
    paths: ['Engine/Sources/Bridge/CWasmtimeBridge/**', 'Engine/Sources/Plugin*/**', 'Engine/Tests/PluginRuntimeTests/**', 'Engine/Validation/Plugins/**', 'Engine/third-party/wasmtime/**', 'Platforms/Web/Plugins/**', 'Tools/Developer/**', '.github/workflows/ci-plugins.yml']
  pull_request:
    paths: ['Engine/Sources/Bridge/CWasmtimeBridge/**', 'Engine/Sources/Plugin*/**', 'Engine/Tests/PluginRuntimeTests/**', 'Engine/Validation/Plugins/**', 'Engine/third-party/wasmtime/**', 'Platforms/Web/Plugins/**', 'Tools/Developer/**', '.github/workflows/ci-plugins.yml']
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: xcode-27, platform: macos-arm64, probe: Engine/build/plugin-probe/GuavaPluginProbe}
          - {runner: ubuntu-latest, platform: linux-x86_64, probe: Engine/build/plugin-probe/GuavaPluginProbe}
          - {runner: windows-2025-vs2026, platform: windows-x86_64, probe: Engine/build/plugin-probe/Release/GuavaPluginProbe.exe}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: SwiftyLab/setup-swift@v1.14.1
        if: runner.os != 'macOS'
        with: {swift-version: '6.4.1'}
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.4.4'
          ninjaVersion: '1.13.2'
      - name: Verify staging transactions
        run: swift test --package-path Tools/Developer --filter PluginStagingTests
      - name: Stage pinned runtime and build portable probe
        shell: bash
        run: |
          ./guava studio plugins stage --platform '${{ matrix.platform }}'
          cmake -S Engine/Validation/Plugins -B Engine/build/plugin-probe -DGUAVA_WASMTIME_VARIANT="$PWD/Engine/vendor/Wasmtime.artifactbundle/${{ matrix.platform }}"
          cmake --build Engine/build/plugin-probe --config Release --parallel 4
          ./guava studio plugins verify --probe '${{ matrix.probe }}'
      - name: Android static-link gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./guava studio plugins stage --platform android-arm64
          cmake -S Engine/Validation/Plugins -B Engine/build/plugin-android -G Ninja \
            -DGUAVA_WASMTIME_VARIANT="$PWD/Engine/vendor/Wasmtime.artifactbundle/android-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=28
          cmake --build Engine/build/plugin-android --parallel 4
      - name: iOS Pulley device build and simulator execution
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          ./guava studio plugins stage --platform ios-arm64
          ./guava studio plugins stage --platform ios-arm64-simulator
          cmake -S Engine/Validation/Plugins -B Engine/build/plugin-ios -G Ninja \
            -DGUAVA_WASMTIME_VARIANT="$PWD/Engine/vendor/Wasmtime.artifactbundle/ios-arm64-simulator" \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          cmake --build Engine/build/plugin-ios --parallel 4
          ./guava studio plugins prepare --probe '${{ matrix.probe }}' --output "$RUNNER_TEMP/plugin-fixtures"
          simulator_id=$(./guava studio ios-simulator udid --prefix iPhone)
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl spawn "$simulator_id" "$PWD/Engine/build/plugin-ios/GuavaPluginProbe.app/GuavaPluginProbe" \
            "$RUNNER_TEMP/plugin-fixtures/reader.guavaplugin/component.wasm" \
            "$RUNNER_TEMP/plugin-fixtures/scene-query.guavaplugin/component.wasm" \
            "$RUNNER_TEMP/plugin-fixtures/infinite.guavaplugin/component.wasm" native
