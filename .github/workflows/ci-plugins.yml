name: Plugin runtimes
on:
  push:
    branches: [main]
    paths: ['Engine/Sources/Plugin*/**', 'Engine/Tests/PluginRuntimeTests/**', 'PluginSDK/**', 'Editor/Plugins/**', 'bun.lock', 'package.json', 'Tools/Developer/Package.swift', 'Tools/Developer/Sources/Build/**', 'Editor/cove.json', 'cove', 'cove.cmd', '.github/actions/fetch-sdk/**', '.github/workflows/ci-plugins.yml']
  pull_request:
    paths: ['Engine/Sources/Plugin*/**', 'Engine/Tests/PluginRuntimeTests/**', 'PluginSDK/**', 'Editor/Plugins/**', 'bun.lock', 'package.json', 'Tools/Developer/Package.swift', 'Tools/Developer/Sources/Build/**', 'Editor/cove.json', 'cove', 'cove.cmd', '.github/actions/fetch-sdk/**', '.github/workflows/ci-plugins.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: xcode-27, platform: macos-arm64}
          - {runner: ubuntu-latest, platform: linux-x86_64}
          - {runner: windows-2025-vs2026, platform: windows-x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Cove SDK
        uses: ./.github/actions/fetch-sdk
      - uses: SwiftyLab/setup-swift@v1.14.1
        if: runner.os != 'macOS'
        with: {swift-version: '6.4.1'}
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.4.4'
          ninjaVersion: '1.13.2'
      - name: Prepare the pinned Bun runtime and TypeScript plugins
        shell: bash
        run: ./cove studio plugins prepare
      - name: Verify public SDK and conversation concurrency
        shell: bash
        run: ./cove studio plugins verify
      - name: Build desktop editor and native broker
        shell: bash
        run: ./cove build Editor
      - name: Verify native contract, lifecycle and broker
        shell: bash
        run: ./cove test Engine --filter Plugin
