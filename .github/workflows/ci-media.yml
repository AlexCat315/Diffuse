name: Media and documents
on:
  push:
    branches: [main]
    paths: ['.github/sdk-revision', 'Engine/Media/**', 'Editor/Documents/**', 'Engine/Sources/AudioRuntime/**', '.github/workflows/ci-media.yml']
  pull_request:
    paths: ['.github/sdk-revision', 'Engine/Media/**', 'Editor/Documents/**', 'Engine/Sources/AudioRuntime/**', '.github/workflows/ci-media.yml']
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, ubuntu-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Guava SDK
        uses: ./.github/actions/fetch-sdk
      - uses: ./.github/actions/setup-toolchains
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and verify real media
        shell: bash
        run: |
          guava task media --
          guava task media -- --check
          # Swift Build's planner crashes on this package on Linux; use the
          # native build system there, as the Engine and Editor jobs do.
          build_system=""
          if [ "$RUNNER_OS" = "Linux" ]; then build_system="--build-system native"; fi
          swift test --package-path Engine/Media $build_system
          swift test --package-path Editor/Documents $build_system
      - name: Compile iOS library
        if: runner.os == 'macOS'
        shell: bash
        run: |
          guava task media -- --platform ios-arm64-simulator
          swift build --package-path Engine/Media --target MediaRuntime --build-system native \
            --triple arm64-apple-ios26.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
