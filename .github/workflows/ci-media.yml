name: Media and documents
on:
  push:
    branches: [main]
    paths: ['Engine/Media/**', 'Editor/Documents/**', 'Engine/Sources/AudioRuntime/**', '.github/workflows/ci-media.yml']
  pull_request:
    paths: ['Engine/Media/**', 'Editor/Documents/**', 'Engine/Sources/AudioRuntime/**', '.github/workflows/ci-media.yml']
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, ubuntu-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-toolchains
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and verify real media
        shell: bash
        run: |
          python Engine/Media/Native/stage.py
          python Engine/Media/Native/stage.py --check
          swift test --package-path Engine/Media
          swift test --package-path Editor/Documents
      - name: Compile iOS library
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python Engine/Media/Native/stage.py --platform ios-arm64-simulator
          swift build --package-path Engine/Media --target MediaRuntime --build-system native \
            --triple arm64-apple-ios16.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
