name: Developer tools

on:
  push:
    branches: [main]
    paths: ['.github/sdk-revision', 'Tools/Developer/**', 'Editor/guava.json', '.github/actions/fetch-sdk/**', '.github/workflows/ci-developer-tools.yml']
  pull_request:
    paths: ['.github/sdk-revision', 'Tools/Developer/**', 'Editor/guava.json', '.github/actions/fetch-sdk/**', '.github/workflows/ci-developer-tools.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Guava SDK
        uses: ./.github/actions/fetch-sdk
      - uses: SwiftyLab/setup-swift@v1.14.1
        if: runner.os != 'macOS'
        with:
          swift-version: '6.4.1'
      - uses: browser-actions/setup-chrome@v2
        if: runner.os != 'Windows'
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Test repository tools
        if: runner.os != 'Linux'
        shell: bash
        env:
          GUAVA_TEST_CHROMIUM: '1'
        run: guava test Tools/Developer
      - name: Test repository tools with a Linux session bus
        if: runner.os == 'Linux'
        shell: bash
        env:
          GUAVA_TEST_CHROMIUM: '1'
        run: dbus-run-session -- guava test Tools/Developer

      - name: Verify SDK and Studio package boundaries
        shell: bash
        run: guava task boundaries --
      - name: Smoke test safe command entry points
        shell: bash
        run: |
          guava task
          for command in maintainability boundaries shader vulkan media plugins native-bootstrap ios-native; do
            guava task "$command" -- --help
          done
      - name: Smoke test host-only command entry points
        if: runner.os != 'Windows'
        shell: bash
        run: |
          guava task validate -- --help
          guava devtools --help
