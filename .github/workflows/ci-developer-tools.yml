name: Developer tools

on:
  push:
    branches: [main]
    paths: ['Tools/Developer/**', '.github/workflows/ci-developer-tools.yml']
  pull_request:
    paths: ['Tools/Developer/**', '.github/workflows/ci-developer-tools.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Guava SDK
        uses: ./.github/actions/fetch-sdk
      - uses: SwiftyLab/setup-swift@v1.14.1
        if: runner.os != 'macOS'
        with:
          swift-version: '6.4.1'
      - uses: browser-actions/setup-chrome@v2
        if: runner.os != 'Windows'
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Test repository tools
        shell: bash
        env:
          GUAVA_TEST_CHROMIUM: '1'
        run: ./guava test Tools/Developer
      - name: Smoke test safe command entry points
        shell: bash
        run: |
          ./guava studio --help
          for command in maintainability boundaries shader vulkan media plugins native-bootstrap ios-native; do
            ./guava studio "$command" --help
          done
      - name: Smoke test host-only command entry points
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./guava studio validate --help
          ./guava studio devtools --help
