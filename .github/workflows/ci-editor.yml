name: GuavaStudioEditor CI

on:
  push:
    branches: [main]
    paths:
      - 'Editor/**'
      - 'Engine/**'
      - '.github/workflows/ci-editor.yml'
      - '.github/actions/setup-toolchains/**'
      - '.github/actions/native-dependencies/**'
      - '.github/actions/fetch-sdk/**'
      - '.github/actions/build-cache/**'
      - 'Editor/guava.json'
      - 'guava'
      - 'guava.cmd'
      - 'Tools/Developer/Package.swift'
      - 'Tools/Developer/Sources/Build/**'
      - 'cmake/**'
  pull_request:
    paths:
      - 'Editor/**'
      - 'Engine/**'
      - '.github/workflows/ci-editor.yml'
      - '.github/actions/setup-toolchains/**'
      - '.github/actions/native-dependencies/**'
      - '.github/actions/fetch-sdk/**'
      - '.github/actions/build-cache/**'
      - 'Editor/guava.json'
      - 'guava'
      - 'guava.cmd'
      - 'Tools/Developer/Package.swift'
      - 'Tools/Developer/Sources/Build/**'
      - 'cmake/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      GUAVA_NATIVE_LINK_ORDER: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: xcode-27
            build-system: swiftbuild
          - name: Linux
            runs-on: ubuntu-latest
            build-system: native
          - name: Windows
            runs-on: windows-2025-vs2026
            build-system: native
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Guava SDK
        uses: ./.github/actions/fetch-sdk

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libibus-1.0-dev \
            libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev libsndio-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            mesa-common-dev ninja-build vulkan-validationlayers

      - uses: ./.github/actions/build-cache
        id: build-cache

      - name: Set up build toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Test shared system contracts
        timeout-minutes: 5
        shell: bash
        run: ./guava test GuavaUI/System --no-parallel --timeout 120

      - name: Prepare cached native dependencies
        uses: ./.github/actions/native-dependencies


      - name: Build Editor, Player, Plugin Host and tests
        timeout-minutes: 25
        shell: bash
        run: ./guava test Editor --build-only

      - uses: actions/cache/save@v5
        if: steps.build-cache.outputs.hit != 'true'
        with:
          key: ${{ steps.build-cache.outputs.key }}
          path: |
            Tools/Developer/.build
            GuavaUI/Tools/Guava/.build
            GuavaUI/System/.build
            Editor/.build
            Engine/.build

      - name: Run XCTest
        if: runner.os != 'Windows'
        timeout-minutes: 6
        shell: bash
        run: ./guava test Editor --skip-build --no-parallel --testing-library xctest --timeout 300

      - name: Run XCTest with hang diagnostics
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: ./GuavaUI/Tools/Testing/Windows.ps1 -Package Editor -Library xctest -Timeout 300 -SkipBuild -Output test-results/xctest

      - name: Run Swift Testing
        if: runner.os != 'Windows'
        timeout-minutes: 11
        shell: bash
        run: ./guava test Editor --skip-build --no-parallel --testing-library swift-testing --timeout 600 --event-output test-results/events.jsonl

      - name: Run Swift Testing with hang diagnostics
        if: runner.os == 'Windows'
        timeout-minutes: 11
        shell: pwsh
        run: ./GuavaUI/Tools/Testing/Windows.ps1 -Package Editor -SkipBuild -Output test-results

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-test-diagnostics-${{ matrix.name }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
