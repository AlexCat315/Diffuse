name: iOS application host
on:
  push:
    branches: [main]
    paths: ['Editor/guava.json', 'Tools/Developer/**', 'guava', 'guava.cmd', '.github/actions/fetch-sdk/**', '.github/workflows/ci-ios.yml']
  pull_request:
    paths: ['Editor/guava.json', 'Tools/Developer/**', 'guava', 'guava.cmd', '.github/actions/fetch-sdk/**', '.github/workflows/ci-ios.yml']
  workflow_dispatch:
jobs:
  simulator:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
        with: {submodules: recursive}
      - name: Fetch pinned Guava SDK
        uses: ./.github/actions/fetch-sdk
      - uses: ./.github/actions/setup-toolchains
      - name: Stage iOS dependencies and build the shared application
        shell: bash
        run: |
          ./guava setup --ios
          application="$RUNNER_TEMP/guava-ios-application"
          ./guava create app "$application" --platforms ios
          ./guava build "$application" --ios --debug --output "$RUNNER_TEMP/guava-ios/Application.app"
      - name: Verify actual simulator rendering
        run: ./guava studio ios-simulator validate "$RUNNER_TEMP/guava-ios/Application.app"
