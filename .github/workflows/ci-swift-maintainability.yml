name: Swift maintainability

on:
  push:
    branches: [main]
    paths:
      - 'Engine/Sources/**'
      - 'Editor/Sources/**'
      - 'Platforms/Android/Sources/**'
      - 'Tools/Developer/**'
      - '.github/workflows/ci-swift-maintainability.yml'
  pull_request:
    paths:
      - 'Engine/Sources/**'
      - 'Editor/Sources/**'
      - 'Platforms/Android/Sources/**'
      - 'Tools/Developer/**'
      - '.github/workflows/ci-swift-maintainability.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Fetch pinned Cove SDK
        uses: ./.github/actions/fetch-sdk
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.4.1'
      - name: Check type and initializer size
        run: |
          swift test --package-path Tools/Developer --filter MaintainabilityTests
          ./cove studio maintainability
