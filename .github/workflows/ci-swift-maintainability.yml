name: Swift maintainability

on:
  push:
    branches: [main]
    paths:
      - 'Engine/Sources/**'
      - 'Editor/Sources/**'
      - 'GuavaUI/Sources/**'
      - 'Tools/Guava/Sources/**'
      - 'Platforms/Android/Sources/**'
      - 'Platforms/Android/Contract/Sources/**'
      - 'GuavaUI/Platforms/Android/Sources/**'
      - 'Tools/Developer/**'
      - '.github/workflows/ci-swift-maintainability.yml'
  pull_request:
    paths:
      - 'Engine/Sources/**'
      - 'Editor/Sources/**'
      - 'GuavaUI/Sources/**'
      - 'Tools/Guava/Sources/**'
      - 'Platforms/Android/Sources/**'
      - 'Platforms/Android/Contract/Sources/**'
      - 'GuavaUI/Platforms/Android/Sources/**'
      - 'Tools/Developer/**'
      - '.github/workflows/ci-swift-maintainability.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.4.1'
      - name: Check type and initializer size
        run: |
          swift test --package-path Tools/Developer --filter MaintainabilityTests
          swift run --package-path Tools/Developer guava-dev maintainability
