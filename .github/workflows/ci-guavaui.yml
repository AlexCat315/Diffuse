name: Pinned SDK integration
on:
  push:
    branches: [main]
    paths: ['GuavaUI', 'Editor/**', 'Engine/**', 'Tools/Developer/**', '.github/workflows/ci-guavaui.yml']
  pull_request:
    paths: ['GuavaUI', 'Editor/**', 'Engine/**', 'Tools/Developer/**', '.github/workflows/ci-guavaui.yml']
jobs:
  integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchains
      - run: ./guava studio native-bootstrap
      - run: ./guava studio boundaries
      - run: ./guava test Editor --filter 'Native(InGameUI|ImageComposition|ViewportIntegration)|ViewportHost|ScriptCanvas' --no-parallel
