name: GuavaUI CI

on:
  push:
    branches: [main]
    paths:
      - 'GuavaUI/**'
      - 'examples/Counter/**'
      - 'Platforms/Android/**'
      - 'Tools/Guava/**'
      - 'examples/GuavaUIStarter/**'
      - 'Tools/Developer/**'
      - 'Engine/**'
      - '.github/workflows/ci-guavaui.yml'
      - '.github/actions/setup-toolchains/**'
      - 'cmake/**'
  pull_request:
    paths:
      - 'GuavaUI/**'
      - 'examples/Counter/**'
      - 'Platforms/Android/**'
      - 'Tools/Guava/**'
      - 'examples/GuavaUIStarter/**'
      - 'Tools/Developer/**'
      - 'Engine/**'

jobs:
  build:
    name: Build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up build toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Build Engine native deps via CMake (SDL3 + Imath + OpenEXR)
        run: |
          cmake -S Engine/third-party -B Engine/build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build Engine/build/native --parallel --config Release
          cmake --build Engine/build/native --parallel --config Release --target stage_sdl3
          cmake --build Engine/build/native --parallel --config Release --target stage_image_decode
          cmake --install Engine/build/native --config Release --prefix "$RUNNER_TEMP/guava-native-install"

      - name: Build GuavaUI native deps via CMake (Yoga + FreeType + HarfBuzz)
        run: |
          cmake -S GuavaUI/third-party -B GuavaUI/build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build GuavaUI/build/native --parallel
          cmake --install GuavaUI/build/native --prefix "$RUNNER_TEMP/guava-native-install"

      # GuavaUI depends on the Engine package, which depends on the local
      # Media package; its FFmpeg binaryTarget only exists after this build
      # stages the bundle into Engine/Media/vendor. Resolving before that
      # fails with "does not contain a binary artifact".
      - name: Build pinned FFmpeg
        run: swift run --package-path Tools/Developer guava-dev media

      - name: Resolve packages
        working-directory: GuavaUI
        run: swift package resolve

      - name: Build pure-Swift targets
        working-directory: GuavaUI
        run: |
          swift build --target GuavaUIRuntime
          swift build --target GuavaUICompose
          swift build --target GuavaUIWorkspace
          swift build --target GuavaUIDevTools
          swift build --target GuavaUI
          swift build --package-path Examples --product GuavaUIDemo

      - name: Run tests
        working-directory: GuavaUI
        # Run every test target, including GuavaUITests, and automatically
        # cover future targets without requiring workflow edits.
        # Native UI suites share font/input environments. Serialize suites as
        # well as their cases; FreeType atlases require one owning thread.
        run: |
          swift test --package-path ../Engine/Logging
          swift test --no-parallel
          swift test --package-path Terminal --no-parallel
          swift test --package-path Examples --no-parallel
          swift test --package-path ../Tools/Guava
          swift run --package-path ../Tools/Developer guava-dev boundaries

  portable:
    name: Portable DevTools (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.4.1'
      - name: Test shared Compose scene and WebSocket service
        run: |
          swift test --package-path GuavaUI/Portable
          swift test --package-path examples/Counter
          swift test --package-path Platforms/Android/Contract
          swift test --package-path Engine/Logging
          swift test --package-path Tools/Guava

  browser:
    name: Wasm browser prototype
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.4.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install matching Wasm SDK
        run: swift sdk install https://download.swift.org/swift-6.4.1-release/wasm-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_wasm.artifactbundle.tar.gz --checksum 783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8
      - name: Build native diagnostic host
        run: swift build --package-path GuavaUI/Portable
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Build Wasm and run browser checks
        working-directory: GuavaUI/Browser
        run: |
          npm ci
          npm run build
          npm run verify
          npm run verify:dev

      - name: Upload browser prototype
        uses: actions/upload-artifact@v4
        with:
          name: guavaui-browser
          path: GuavaUI/Browser/dist

  text:
    name: Shared FreeType/HarfBuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: '6.4.1'
      - name: Build native font dependencies
        run: |
          cmake -S GuavaUI/third-party -B GuavaUI/build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build GuavaUI/build/native --parallel 4
          cmake --install GuavaUI/build/native --prefix "$RUNNER_TEMP/guava-font-install"
      - name: Test memory lifetime, fallback, shaping, atlas updates and HiDPI
        run: swift test --package-path GuavaUI/Text
