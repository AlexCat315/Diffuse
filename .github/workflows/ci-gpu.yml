name: Hardware regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: [self-hosted, macOS, ARM64, cove-gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch pinned Cove SDK
        uses: ./.github/actions/fetch-sdk

      - name: Verify build tools and hardware
        run: |
          mkdir -p "$RUNNER_TEMP/cove-gpu-regression"
          ./cove doctor --mac
          cmake --version
          system_profiler SPDisplaysDataType > "$RUNNER_TEMP/cove-gpu-regression/device.log"
          cat "$RUNNER_TEMP/cove-gpu-regression/device.log"

      - name: Build native dependencies
        run: |
          ./cove studio native-bootstrap

      - name: Verify pinned shader toolchain and bundled artifacts
        run: |
          ./cove studio shader bootstrap-slang --destination "$RUNNER_TEMP/cove-slang"
          export SLANGC="$RUNNER_TEMP/cove-slang/bin/slangc"
          ./cove test Tools/Developer --filter ShaderToolchainTests
          ./cove test Tools/Developer --filter RegressionReportTests
          ./cove studio shader rebuild --check
          SLANGC="$SLANGC" ./cove test CoveUI/Graphics --filter NativeRHITests

      - name: Run M7 destruction performance gates
        shell: bash
        run: |
          ./cove internal build-package Engine --release --product PhysicsRuntimeBenchmarks --result-file "$RUNNER_TEMP/physics-products.json"
          benchmark="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/physics-products.json")).products')/PhysicsRuntimeBenchmarks"
          COVE_PHYSICS_SCENARIO=destruction-fragments \
          COVE_PHYSICS_BODIES=4096 \
          COVE_PHYSICS_WARMUP_FRAMES=30 \
          COVE_PHYSICS_SAMPLE_FRAMES=120 \
          "$benchmark" | tee "$RUNNER_TEMP/cove-gpu-regression/physics-fragments.log"
          COVE_PHYSICS_SCENARIO=destruction-islands \
          COVE_PHYSICS_BODIES=4096 \
          COVE_PHYSICS_WARMUP_FRAMES=30 \
          COVE_PHYSICS_SAMPLE_FRAMES=120 \
          "$benchmark" | tee "$RUNNER_TEMP/cove-gpu-regression/physics-islands.log"

      - name: Run actual GPU regressions
        env:
          COVE_GPU_TEST_OUTPUT_DIR: ${{ runner.temp }}/cove-gpu-regression
        run: ./cove studio gpu-regression run

      - name: Save pixel captures, test report and device log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gpu-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/cove-gpu-regression
          if-no-files-found: warn
          retention-days: 14
