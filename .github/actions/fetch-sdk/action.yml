name: Fetch Guava SDK
description: Install the shared versioned Guava SDK.
runs:
  using: composite
  steps:
    - name: Install pinned SDK
      shell: bash
      run: |
        set -euo pipefail
        version=$(node -p 'JSON.parse(require("fs").readFileSync("Editor/guava.json")).toolchain.sdkVersion')
        if [ "$RUNNER_OS" = Windows ]; then
          curl -fsSL https://github.com/AlexCat315/GuavaUI/releases/latest/download/install.ps1 -o "$RUNNER_TEMP/install-guava.ps1"
          pwsh -NoProfile -File "$RUNNER_TEMP/install-guava.ps1" -Version "$version"
          sdk="$LOCALAPPDATA/Guava/versions/$version"
          echo "$LOCALAPPDATA/Guava/bin" >> "$GITHUB_PATH"
        else
          curl -fsSL https://github.com/AlexCat315/GuavaUI/releases/latest/download/install.sh -o "$RUNNER_TEMP/install-guava.sh"
          sh "$RUNNER_TEMP/install-guava.sh" --version "$version"
          sdk="${GUAVA_HOME:-${XDG_DATA_HOME:-$HOME/.local/share}/guava}/versions/$version"
          if [ "$RUNNER_OS" = macOS ]; then sdk="${GUAVA_HOME:-$HOME/.guava}/versions/$version"; fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        echo "GUAVA_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
        GUAVA_SHARED_SDK="$sdk" node -e 'require("fs").symlinkSync(process.env.GUAVA_SHARED_SDK, "GuavaUI", process.platform === "win32" ? "junction" : "dir")'
