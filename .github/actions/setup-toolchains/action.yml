name: Guava build toolchains
description: Install the verified release toolchains on macOS, Linux and Windows.
runs:
  using: composite
  steps:
    - name: Select Xcode 27.0
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_27.0.app
        echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
        echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"
        echo "/Applications/Xcode_27.0.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
        xcodebuild -version
    - uses: SwiftyLab/setup-swift@v1.14.1
      if: runner.os != 'macOS'
      with:
        swift-version: '6.4.1'
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '4.4.4'
        ninjaVersion: '1.13.2'
    - uses: msys2/setup-msys2@v2
      id: msys2
      if: runner.os == 'Windows'
      with:
        msystem: MSYS
        install: make diffutils
        path-type: inherit
    - name: Expose MSYS build utilities
      if: runner.os == 'Windows'
      shell: pwsh
      run: '"${{ steps.msys2.outputs.msys2-location }}/usr/bin" >> $env:GITHUB_PATH'
    - name: Load MSVC developer environment
      # FFmpeg is configured with `--toolchain=msvc --cc=cl`; `cl` can only
      # compile and link once INCLUDE/LIB/PATH point at the MSVC toolchain, which
      # only happens inside a Developer Command Prompt. This action scripts
      # vcvarsall and persists the environment to GITHUB_ENV so the later
      # `guava-dev media` step can drive `cl` for the Windows FFmpeg build.
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install Zig
      # libghostty-vt (GuavaUITerminal) is built with Zig; Ghostty pins the
      # exact compiler release it supports.
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    - name: Verify toolchains
      shell: bash
      run: |
        swift_version="$(swift --version)"
        echo "$swift_version"
        case "$swift_version" in
          *"Swift version 6.4"*) ;;
          *) echo "Expected Swift 6.4.x" >&2; exit 1 ;;
        esac
        cmake --version
        ninja --version
        zig version

    - name: Install native Vulkan headers and loader on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

    - name: Install pinned native Vulkan headers and loader on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        guava task vulkan -- bootstrap --destination "$RUNNER_TEMP/guava-vulkan-sdk"
        echo "VULKAN_SDK=$RUNNER_TEMP/guava-vulkan-sdk" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/guava-vulkan-sdk/bin" >> "$GITHUB_PATH"
