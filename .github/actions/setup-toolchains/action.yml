name: Guava build toolchains
description: Install the verified release toolchains on macOS, Linux and Windows.
runs:
  using: composite
  steps:
    - name: Select Xcode 27.0
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_27.0.app
        echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
        echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"
        echo "/Applications/Xcode_27.0.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
        xcodebuild -version
    - uses: SwiftyLab/setup-swift@v1.14.1
      if: runner.os != 'macOS'
      with:
        swift-version: '6.4.1'
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14.8'
    - name: Install CMake and Ninja
      shell: bash
      run: python -m pip install cmake==4.4.4 ninja==1.13.2
    - uses: msys2/setup-msys2@v2
      id: msys2
      if: runner.os == 'Windows'
      with:
        msystem: MSYS
        install: make diffutils
        path-type: inherit
    - name: Expose MSYS build utilities
      if: runner.os == 'Windows'
      shell: pwsh
      run: '"${{ steps.msys2.outputs.msys2-location }}/usr/bin" >> $env:GITHUB_PATH'
    - name: Verify toolchains
      shell: bash
      run: |
        python - <<'PY'
        import re
        import subprocess
        actual = subprocess.check_output(["swift", "--version"], text=True)
        print(actual)
        if not re.search(r"Swift version 6\.4(?:\.\d+)?(?:\s|$)", actual):
            raise SystemExit("Expected Swift 6.4.x")
        PY
        cmake --version
        ninja --version
        python --version

    - name: Install native Vulkan headers and loader on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
    - name: Install pinned native Vulkan headers and loader on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python scripts/bootstrap-rhi-vulkan.py --destination "$RUNNER_TEMP/guava-vulkan-sdk"
        echo "VULKAN_SDK=$RUNNER_TEMP/guava-vulkan-sdk" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/guava-vulkan-sdk/bin" >> "$GITHUB_PATH"
    - name: Validate shader toolchain and GPU regression contracts
      shell: bash
      run: |
        python scripts/test-rhi-shader-toolchain.py
        python scripts/test-gpu-regression-verifier.py
