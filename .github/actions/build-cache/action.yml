name: Studio Swift build cache
description: Restore incremental products for the pinned Studio and SDK toolchains.
outputs:
  key:
    description: Key to save after compilation succeeds.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  hit:
    description: Whether this commit was already cached.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v5
      id: restore
      with:
        path: |
          Tools/Developer/.build
          GuavaUI/Tools/Guava/.build
          GuavaUI/System/.build
          Editor/.build
          Engine/.build
        key: studio-swift-v1-${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Editor/guava.json', '**/Package.swift', '**/Package.resolved', '.github/actions/setup-toolchains/action.yml') }}-${{ github.sha }}
        restore-keys: |
          studio-swift-v1-${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Editor/guava.json', '**/Package.swift', '**/Package.resolved', '.github/actions/setup-toolchains/action.yml') }}-
